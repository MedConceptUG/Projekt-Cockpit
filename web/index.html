<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projekt-Cockpit</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f4f6;--panel:#fff;--panel2:#f6f7f9;--ink:#1a1d23;--muted:#6b7280;--line:#e2e5e9;--acc:#2f5bea;--acc-ink:#fff;--late:#d33b2c;--ok:#1f9d55;--wait:#c27c0e;--work:#2f5bea;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--panel:#191c20;--panel2:#20242a;--ink:#e7e9ec;--muted:#959ca6;--line:#2c3138;--acc:#6c8cff;--acc-ink:#0d1020;--late:#ff6b5b;--ok:#3ecf7a;--wait:#f0a935;--work:#6c8cff;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--late)}
button.pri.red{background:var(--late);border-color:var(--late);color:#fff}
button.sm{padding:3px 8px;font-size:12.5px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
a{color:var(--acc);cursor:pointer}
.muted{color:var(--muted)}.late{color:var(--late)}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:3px;overflow:auto}
.brand{font-weight:700;font-size:15.5px;padding:2px 8px 12px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.nav button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;color:var(--muted)}
.nav button.on{background:var(--panel2);color:var(--ink);font-weight:600}
.nav kbd{font:11px ui-monospace,monospace;opacity:.6}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:14px 8px 3px}
.pf{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:4px 10px;text-align:left;border-radius:7px}
.pf:hover{background:var(--panel2)}
.pf.off{opacity:.38}
.pf .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.pf .n{flex:1;overflow:hidden;text-overflow:ellipsis}
.pf .c{font-size:12px;color:var(--muted)}
.foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.foot .btns{display:flex;flex-wrap:wrap;gap:5px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wait);margin-right:6px}
.sdot.ok{background:var(--ok)}.sdot.err{background:var(--late)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
.top #quick{flex:1;min-width:180px}
.top #search{width:180px}
#view{flex:1;overflow:auto;padding:16px 18px}
.banner{background:color-mix(in srgb,var(--wait) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--wait) 40%,var(--line));border-radius:9px;padding:9px 13px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.card h3 b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.bad b{color:var(--late)}.kpi.warn b{color:var(--wait)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:flex-start;gap:9px;padding:7px 4px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--ok)}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-title{overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.due{font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--late);font-weight:600}
.prio{width:4px;align-self:stretch;border-radius:2px;flex:none}
.prio.p1{background:var(--late)}.prio.p2{background:color-mix(in srgb,var(--muted) 35%,transparent)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}
.dchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap}
.dchip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.st{font-size:11px;padding:0 6px;border-radius:5px;border:1px solid}
.st.wartet{color:var(--wait)}.st.arbeit{color:var(--work)}
.evrow{display:flex;gap:9px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.evrow:first-of-type{border-top:0}
.evrow .d{font-size:12px;color:var(--muted);width:62px;flex:none;padding-top:1px}
.type{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.empty{color:var(--muted);font-size:13px;padding:6px 4px}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:5px 0 2px}
.prog i{display:block;height:100%;background:var(--c)}
.grp{font-size:12px;font-weight:600;margin:8px 4px 0;color:var(--muted)}
.dtab{width:100%;border-collapse:collapse;font-size:13px}
.dtab td{padding:5px 4px;border-top:1px solid var(--line)}
.dtab tr:first-child td{border-top:0}
.dtab td.n{text-align:right;width:52px;color:var(--muted)}
/* Gantt */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--panel2);font-weight:600}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.chk input{width:auto}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap;align-items:center}
.legend .ic{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--muted);vertical-align:-4px;margin-right:4px}
.legend .ic svg{width:16px;height:16px}
.tl{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:calc(100vh - 140px)}
.tl-in{position:relative}
.tl-axis{position:sticky;top:0;z-index:6;display:flex;height:42px;background:var(--panel);border-bottom:1px solid var(--line)}
.tl-lab{position:sticky;left:0;z-index:5;width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line)}
.tl-axis .tl-lab{z-index:7;font-size:12px;color:var(--muted);padding:12px 10px}
.tl-trk{position:relative;flex:none}
.tl-m{position:absolute;top:0;height:21px;font-size:12px;font-weight:600;padding:3px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-w{position:absolute;top:21px;height:21px;font-size:10.5px;color:var(--muted);padding:3px 4px;border-left:1px solid var(--line);white-space:nowrap}
.tl-row{display:flex;border-bottom:1px solid var(--line)}
.tl-row.ph-row{background:var(--panel2)}
.tl-row.ph-row .tl-lab{background:var(--panel2);padding:6px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;border-left:4px solid var(--c)}
.tl-row.ph-row .tl-lab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tl-row.lane .tl-lab{padding:5px 8px 5px 22px;display:flex;align-items:flex-start;gap:6px;font-size:13px}
.tl-row.lane .tl-lab .bar-c{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.tl-row.lane .tl-lab .ln{flex:1;min-width:0}
.tl-row.lane .tl-lab small{display:inline;color:var(--muted);font-size:11px;margin-left:6px}
.tl-row.lane .tl-lab .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px}
.tl-row.lane .tl-lab .bar-c{position:absolute;left:12px;top:5px;bottom:5px}
table.vt{border-collapse:collapse;width:100%;font-size:13px}.vt td{padding:4px 6px;border-bottom:1px solid var(--line)}
.rlab{position:absolute;left:24px;right:6px;height:20px;line-height:20px;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:4px;padding:0 4px}
.rlab:hover{background:var(--panel2)}.rlab.sel{background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.rlab i{font-style:normal;color:var(--muted)}.rlab .rt.erledigt{color:var(--muted);text-decoration:line-through}.rlab .rt.late{color:var(--late);font-weight:600}.rlab .rt.ev{color:var(--muted)}
.rlab.du{color:var(--muted);font-size:11px;padding-left:14px}
.tl-row.lane .tl-lab button{opacity:0;padding:0 6px}
.tl-row.lane:hover .tl-lab button{opacity:1}
.vl{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--muted) 22%,transparent);pointer-events:none}
.vl.m{background:var(--line)}
.vl.d{background:color-mix(in srgb,var(--line) 45%,transparent)}
.tl-d{position:absolute;top:42px;height:20px;font-size:10px;color:var(--muted);text-align:center;line-height:20px;border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap;overflow:hidden}
.tl-d.we{background:color-mix(in srgb,var(--muted) 7%,transparent)}
.tl-d.td{background:var(--late);color:#fff;font-weight:700}
.wkend{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 4%,transparent);pointer-events:none}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:4;pointer-events:none;opacity:.75}
.ph{position:absolute;top:7px;height:20px;border-radius:5px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);font-size:11.5px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.cur{font-weight:600}
.ph{cursor:grab;z-index:2}.ph.alt{background:color-mix(in srgb,var(--c) 34%,transparent)}
.ph .phn{position:relative}
.ph .hd{position:absolute;top:-1px;bottom:-1px;width:7px;cursor:ew-resize;z-index:2;border-radius:3px}.ph .hd.l{left:0}.ph .hd.r{right:0}
.ph.nb{outline:2px solid var(--acc);outline-offset:1px}
.ph.ovl{border:1.5px dashed var(--wait)}
.ph.ovl::after{content:'überlappt';position:absolute;right:6px;top:1px;font-size:10px;color:var(--wait);font-weight:600}
.ph:hover .hd{background:color-mix(in srgb,var(--c) 80%,transparent)}
.ph.ov{outline:2px solid var(--wait);outline-offset:1px}
.tl-trk[data-phrow]{cursor:crosshair}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.ar{fill:none;stroke:color-mix(in srgb,var(--muted) 60%,transparent);stroke-width:1.3;stroke-linejoin:round}
.ar.x{stroke-dasharray:4 3}
.ar.hl{stroke:var(--acc);stroke-width:2.3;stroke-dasharray:none}
.ar.dim{opacity:.12}
.bar{position:absolute;height:20px;border-radius:5px;background:color-mix(in srgb,var(--c) 30%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 70%,transparent);cursor:pointer;z-index:3;display:flex;align-items:center;gap:4px;padding:0 3px;font-size:12px;min-width:8px}
.bar .evi{position:absolute;top:50%}
.evi{width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 85%,var(--ink) 15%);display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal;line-height:1;z-index:3;cursor:pointer;box-sizing:border-box;text-decoration:none}
.evi.en{border-radius:4px}
.evi.plan{border-style:dashed;background:color-mix(in srgb,var(--panel) 70%,transparent);opacity:.9}
.evi.plan::before{content:"";position:absolute;inset:-2px;border-radius:inherit}
.evi.sig-kritisch{border-color:var(--late);background:color-mix(in srgb,var(--late) 16%,var(--panel))}
.evi.sig-positiv{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.evi.sig-erledigt{border-color:color-mix(in srgb,var(--late) 50%,transparent)}
.evi.copen::after{content:"!";position:absolute;right:-6px;top:-7px;width:11px;height:11px;border-radius:50%;background:var(--late);color:#fff;font:700 8px/11px system-ui;text-align:center}
.evi.sel{outline:2px solid var(--acc);outline-offset:1px}
.evi.hov{outline:2px dashed var(--acc);outline-offset:1px}
.evi.dim{opacity:.35}
.evi.tgt,.dum.tgt .evi{outline:3px solid var(--acc)}
.evi{cursor:crosshair}
.evsym{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex:none;color:var(--acc)}.evsym.plan{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.evpal{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:0 0 6px;font-size:12px}.evpal .muted{margin-right:4px}.evp{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:grab;font-size:13px;user-select:none}.evp:hover{border-color:var(--acc);box-shadow:var(--shadow)}.evp:active{cursor:grabbing}
.msl{position:absolute;width:0;border-left:2px dashed color-mix(in srgb,var(--ink) 55%,transparent);z-index:4;pointer-events:none}.msl.plan{border-left-style:dotted;opacity:.7}
.msl.review{border-left-color:color-mix(in srgb,var(--acc) 80%,transparent)}
.msl-lab{position:absolute;z-index:4;font-size:10.5px;line-height:14px;padding:0 4px;border-radius:3px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}.msl-lab.review{border-color:var(--acc);color:var(--acc)}
.vac{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 11%,transparent) 0 6px,color-mix(in srgb,var(--muted) 20%,transparent) 6px 12px);pointer-events:none;z-index:0}
.vac-ax{position:absolute;bottom:1px;height:14px;border-radius:3px;background:color-mix(in srgb,var(--muted) 28%,var(--panel));color:var(--ink);font-size:10px;line-height:14px;padding:0 3px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2}
.vac-ax.p{background:color-mix(in srgb,var(--wait) 30%,var(--panel));bottom:16px}
.bar .bl:not(.out),.bar .who{position:relative;z-index:2}
.vacb{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--panel) 80%,transparent) 0 3px,transparent 3px 6px);pointer-events:none;z-index:1;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.dum{position:absolute;height:18px;display:flex;align-items:center;gap:5px;z-index:3;cursor:pointer;font-size:11.5px;white-space:nowrap}
.dum .evi{position:relative;flex:none;margin:0}
.dum::before{content:"";position:absolute;left:7px;bottom:100%;height:var(--h);border-left:1.5px dotted color-mix(in srgb,var(--c) 75%,transparent)}
.dum .dl{color:var(--ink);opacity:.82}.dum .dl small{color:var(--muted);margin-left:4px}
.dum.dim{opacity:.3}.dum.sel .dl{font-weight:600;opacity:1}.dum.hov .dl{text-decoration:underline}
.bar.si{padding-left:28px}.bar.ei{padding-right:28px}
.bar.eo .bl.out{left:calc(100% + 26px)}.bar.eo .cn{right:-36px}
.bar.so{margin-left:0}
.ar.ev{stroke-dasharray:none}
.bar.erledigt{background:color-mix(in srgb,var(--c) 10%,var(--panel));border-style:dashed;color:var(--muted)}
.bar.erledigt .bl{text-decoration:line-through}
.bar.wartet{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 25%,var(--panel)) 0 6px,color-mix(in srgb,var(--wait) 22%,var(--panel)) 6px 12px)}
.bar.arbeit{background:color-mix(in srgb,var(--c) 55%,var(--panel))}
.bar.late{border:2px solid var(--late)}
.bar .who{width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.3px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bl.out{position:absolute;left:calc(100% + 6px);top:1px;max-width:230px;color:var(--ink)}
.bl em{font-style:normal;color:var(--muted)}
.evm{position:absolute;width:22px;height:22px;top:0;border-radius:50%;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.evm .em{font-size:12px;line-height:1;filter:saturate(.85)}
.evm.sig-kritisch{border:3px solid var(--late);background:color-mix(in srgb,var(--late) 14%,var(--panel))}
.evm.sig-kritisch .bl.out{color:var(--late)}
.evm.sig-erledigt{border:2px dashed color-mix(in srgb,var(--late) 50%,transparent)}
.evm.sig-positiv{border:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.evm.copen::after{content:"!";position:absolute;right:-7px;top:-7px;width:13px;height:13px;border-radius:50%;background:var(--late);color:#fff;font:700 9px/13px system-ui;text-align:center}
.evm.copen{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--late) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.lg{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--muted);vertical-align:-2px;margin-right:4px;position:relative}
.lg.sig-kritisch{border:3px solid var(--late)}.lg.sig-positiv{border:3px solid var(--ok)}
.lg.copen{background:var(--late)}
.mp{font-style:normal;font-size:10.5px;color:var(--acc);margin-left:5px;font-weight:600}
.cbadge{background:var(--late);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 6px}
.tsig{font-size:11px;padding:0 6px;border-radius:5px;border:1px solid var(--line)}.tsig.kritisch{color:var(--late);border-color:var(--late)}.tsig.positiv{color:var(--ok);border-color:var(--ok)}
.evm .bl.out{font-size:12px;font-weight:600;top:1px}
.bar.hov,.evm.hov{outline:2px dashed var(--acc);outline-offset:2px}
.cp{stroke:var(--acc);stroke-width:1.6;stroke-dasharray:2 3;fill:none;opacity:.55}
.cp.hov,.cp.hl{opacity:1;stroke-width:2.4;stroke-dasharray:none}
.cp.dim{opacity:.1}
.cpd{fill:var(--acc);opacity:.7}
.bar.sel,.evm.sel{outline:3px solid var(--acc);outline-offset:1px}
.dim{opacity:.18}
/* Drawer */

 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}

<script>
'use strict';
/* ================= Grundlagen ================= */
const KEY='projektcockpit.v2',UIKEY='projektcockpit.ui.v2';
/* Desktop-Programm (pywebview) liefert die Seite über http://127.0.0.1 aus; im Browser läuft sie als Datei */
const DESK=/^https?:$/.test(location.protocol)&&/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
/* bereit erst, wenn der Programmkern seine Funktionen angemeldet hat (window.pywebview.api ist anfangs leer) */
const apiOk=()=>!!(window.pywebview&&window.pywebview.api&&typeof window.pywebview.api.get_config==='function');
const deskReady=new Promise(r=>{if(!DESK)return r(false);if(apiOk())return r(true);window.addEventListener('pywebviewready',()=>r(apiOk()||true));
  const t0=Date.now(),iv=setInterval(()=>{if(apiOk()){clearInterval(iv);r(true)}else if(Date.now()-t0>15000){clearInterval(iv);r(false)}},100)});
/* Aufrufe in den Programmkern: Fehler werden angezeigt statt still verschluckt */
let APIX=null;
function apiErr(n,e){const m=String(e&&e.message||e);console.error('API',n,m);
  if(typeof info==='function')info(`Der Programmkern meldet einen Fehler (${n}):\n${m}\n\nDetails stehen in der Logdatei (Einstellungen → Diagnose).`)}
const API=()=>APIX||(APIX=new Proxy({},{get:(t,n)=>async(...a)=>{let r;
  try{let f=window.pywebview&&window.pywebview.api&&window.pywebview.api[n];if(typeof f!=='function'){await deskReady;f=window.pywebview&&window.pywebview.api&&window.pywebview.api[n]}
    if(typeof f!=='function')throw new Error('Funktion „'+n+'“ im Programmkern nicht verfügbar');r=await f(...a)}
  catch(e){apiErr(n,e);throw e}
  if(r&&typeof r==='object'&&!Array.isArray(r)&&r.__error){apiErr(n,r.__error);throw new Error(r.__error)}return r}}));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function relDate(s){if(!s)return '';const d=diffDays(TODAY(),s);if(d===0)return 'Heute';if(d===1)return 'Morgen';if(d===-1)return 'Gestern';if(d<0)return `vor ${-d} T.`;if(d<7)return WD[new Date(s+'T12:00:00').getDay()]+' '+fmt(s).slice(0,5);return fmt(s)}
function kw(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

const initials=w=>String(w||'').split(/[\s,._-]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');

const STATUS={offen:'Offen',arbeit:'In Arbeit',wartet:'Wartet',erledigt:'Erledigt'};
const DEFAULT_TYPES=[['mail','📧','Mail','neutral'],['telefonat','📞','Telefonat','neutral'],['meeting','👥','Meeting','neutral'],['person','👤','Person','neutral'],['lieferant','🏭','Lieferant','neutral'],['angebot','💰','Angebot','neutral'],['lieferung','📦','Lieferung','neutral'],['aenderung','🔄','Änderung','neutral'],['entscheidung','⚖️','Entscheidung','neutral'],['befund','🔍','Befund / Ergebnis','neutral'],['freigabe','✅','Freigabe','positiv'],['ablehnung','❌','Ablehnung','kritisch'],['risiko','⚠️','Risiko','kritisch'],['problem','❗','Problem / Abweichung','kritisch'],['meilenstein','🚩','Meilenstein','neutral'],['review','📋','Design Review','neutral'],['schulung','🎓','Schulung','neutral'],['info','ℹ️','Info / Notiz','neutral']];

const pVis=pid=>!UI.pf.length||UI.pf.includes(pid);
const dVis=did=>!UI.df.length||UI.df.includes(did||'');
const pids=x=>x.projectIds||[];
const inP=(x,pid)=>pid?pids(x).includes(pid):!pids(x).length;

function allEdges(){const ed=[];S.todos.forEach(t=>{if(t.eventId&&E(t.eventId))ed.push([t.eventId,t.id]);if(t.endEventId&&E(t.endEventId)&&t.endEventId!==t.eventId)ed.push([t.id,t.endEventId]);(t.causes||[]).forEach(c=>{if(c!==t.eventId&&X_(c))ed.push([c,t.id])})});S.events.forEach(e=>(e.causes||[]).forEach(c=>{if(X_(c)&&!(T(c)&&T(c).endEventId===e.id))ed.push([c,e.id])}));return ed}

/* kritisches Event gilt als abgestellt, wenn seine direkten Folgen erledigt/eingetreten sind oder eine eingetretene Freigabe / ein Befund direkt folgt */
function critResolved(e){const kids=allEdges().filter(([a])=>a===e.id).map(([,b])=>b);if(!kids.length)return false;
  if(kids.some(k=>{const x=E(k);return x&&evDone(x)&&(sigOf(x)==='positiv'||['freigabe','befund'].includes(x.type))}))return true;
  return kids.every(k=>T(k)?T(k).status==='erledigt':E(k)?evDone(E(k)):true)}
const critPending=e=>sigOf(e)==='kritisch'&&!critOpen(e)&&!critResolved(e);
const directOpen=e=>allEdges().filter(([a,b])=>a===e.id&&T(b)&&T(b).status!=='erledigt').length;

/* ===== Urlaub / arbeitsfreie Zeiten: Wer leer = alle, sonst nur ToDos dieser Person (Feld „Wer“) ===== */
const vacs=()=>S.vacations||[];
const isMS=e=>e&&(e.type==='meilenstein'||e.type==='review');
const whoList=w=>String(w||'').toLowerCase().split(/[,;/&+]|\bund\b/).map(x=>x.trim()).filter(Boolean);
const vacApplies=(v,t)=>!String(v.who||'').trim()||whoList(t.who).includes(String(v.who).trim().toLowerCase());
const vacOf=(t,L)=>(L||vacs()).filter(v=>v.from&&v.to&&vacApplies(v,t));
const offIn=(V,d)=>V.some(v=>d>=v.from&&d<=v.to);
function netDays(V,a,b){if(!a||!b)return 0;let n=0,g=0;for(let d=a;d<=b&&g++<3000;d=addDays(d,1))if(!offIn(V,d))n++;return n}
function fwdOn(V,d){let g=0;while(d&&offIn(V,d)&&g++<800)d=addDays(d,1);return d}
function endAfter(V,a,n){let d=a,c=1,g=0;while(c<n&&g++<3000){d=addDays(d,1);if(!offIn(V,d))c++}return d}
/* ToDo auf neuen Start legen und dabei seine Arbeitstage (ohne Urlaub) behalten */
function vacShift(t,ns,o){const V=vacOf(t);if(!V.length||!o.s||!o.e)return [ns,o.s&&o.e?addDays(ns,diffDays(o.s,o.e)):ns];const n=Math.max(1,netDays(V,o.s,o.e)),a=fwdOn(V,ns);return [a,endAfter(V,a,n)]}
function setDates(x,v,src){if(E(x.id))x.date=v.s;else if(src||!(x.start||x.due)){x.start=v.s;x.due=v.e}else{if(x.start)x.start=v.s;if(x.due||!x.start)x.due=v.e}}
/* Kopplung + Folgen: geplante Events wandern mit ihrem ToDo (Start = Balkenstart, Abschluss = Balkenende), eingetretene Events bleiben fest.
   c = gekoppelt (zieht immer mit), sonst nur Folge (Ursache vor Wirkung). */
function propagate(id,ns,ne,push=true){
  const {par,chi}=graphMaps(),nw=new Map([[id,{s:ns,e:ne,c:true}]]),q=[id];let g=0;
  const cur=x=>nw.get(x.id)||{s:sOf(x),e:eOf(x)};
  const set=(x,s,e,c)=>{if(!x||x.id===id)return;if(T(x.id)&&x.status==='erledigt')return;if(E(x.id)&&evDone(x))return;const o=cur(x);if(o.s===s&&o.e===e)return;const pv=nw.get(x.id);nw.set(x.id,{s,e,c:!!(c||(pv&&pv.c))});q.push(x.id)};
  while(q.length&&g++<20000){const cid=q.shift(),x=X_(cid);if(!x)continue;const st=cur(x),c=!!nw.get(cid)?.c;if(!st.s)continue;
    if(T(cid)){const o={s:sOf(x),e:eOf(x)},d1=diffDays(o.s,st.s),d2=diffDays(o.e,st.e);
      const se=E(x.eventId),ee=E(x.endEventId);if(se)set(se,st.s,st.s,c);if(ee&&ee!==se)set(ee,st.e,st.e,c);
      evDuring(cid).forEach(e=>{if(!e.date)return;let d=d1===d2?addDays(e.date,d1):e.date;if(d<st.s)d=st.s;if(d>st.e)d=st.e;set(e,d,d,c)})}
    else{const d=st.s;S.todos.forEach(t=>{const o=cur(t);if(t.eventId===cid&&o.s!==d){const [a,b]=vacShift(t,d,o);set(t,a,b,c)}
        if(t.endEventId===cid&&t.eventId!==cid&&o.e!==d)set(t,o.s&&o.s>d?d:o.s,d,c)})}
    if(push)(chi[cid]||[]).forEach(k=>{const y=X_(k);if(!y||k===id)return;if(T(k)&&(y.eventId===cid))return;if(T(cid)&&x.endEventId===k)return;
      if(T(k)&&y.status==='erledigt')return;if(E(k)&&evDone(y))return;const sk=cur(y);if(!sk.s)return;
      let req=null;(par[k]||[]).forEach(p=>{const z=X_(p);if(!z)return;const pe=cur(z).e;if(pe&&(!req||pe>req))req=pe});
      if(req&&sk.s<req){if(T(k)){const [a,b]=vacShift(y,req,sk);set(y,a,b,false)}else set(y,req,req,false)}})}
  return nw}
/* nach Änderungen außerhalb des Ziehens: gekoppelte Punkte nachziehen */
function applyCouple(id){const x=X_(id);if(!x||!sOf(x))return [];const m=propagate(id,sOf(x),eOf(x),false),out=[];
  m.forEach((v,k)=>{if(k===id)return;const y=X_(k),os=sOf(y),oe=eOf(y);setDates(y,v);out.push(y);
    S.log.unshift(logEntry('verschoben',E(k)?'event':'todo',y,`${y.title} – ${rng(os,oe)} → ${rng(sOf(y),eOf(y))} (gekoppelt an „${x.title}“)`))});return out}
/* Event ist eingetreten: Datum ggf. auf heute, gekoppelte Punkte nachziehen, ToDos mit diesem Abschluss-Event automatisch erledigen */
function occurEvent(e,setToday){const msg=[],head=[];if(!e)return msg;const was=evDone(e);e.done=true;
  if(setToday&&(!was||e.date>TODAY())&&e.date!==TODAY()){const od=e.date;e.plan=od;e.date=TODAY();applyCouple(e.id).forEach(y=>msg.push(`${y.title}: ${rng(sOf(y),eOf(y))}`));if(!was)S.log.unshift(logEntry('eingetreten','event',e,`${e.title} – eingetreten am ${fmt(e.date)}${od?` (geplant ${fmt(od)})`:''}`))}
  else if(!was)S.log.unshift(logEntry('eingetreten','event',e,`${e.title} – eingetreten am ${fmt(e.date)}`));
  evEnds(e.id).forEach(t=>{if(t.status==='erledigt')return;if(ckOpenReq(t.steps).length){head.push(`⚠ „${t.title}“ nicht automatisch erledigt – Pflichtpunkte offen`);return}
    t.status='erledigt';t.doneAt=TODAY();S.log.unshift(logEntry('erledigt','todo',t,`${t.title} – automatisch erledigt (Abschluss-Event „${e.title}“ eingetreten)`));head.push(`✓ „${t.title}“ erledigt`)});
  if(!was)head.unshift(`■ „${e.title}“ eingetreten`);return [...head,...msg]}
/* ToDo erledigt → sein geplantes Abschluss-Event tritt heute ein (zieht Folge-ToDos nach) */
function closeEndEvent(t){const e=E(t.endEventId);if(!e||evDone(e))return [];return occurEvent(e,true)}
function openFollow(id){const {chi}=graphMaps();return [...reach(id,chi)].map(T).filter(t=>t&&t.status!=='erledigt').length}
const critOpen=e=>sigOf(e)==='kritisch'&&!hasFollow(e.id);
function graphMaps(){const par={},chi={};allEdges().forEach(([a,b])=>{(chi[a]=chi[a]||[]).push(b);(par[b]=par[b]||[]).push(a)});return {par,chi}}
function reach(start,map){const s=new Set,st=[start];while(st.length){const c=st.pop();(map[c]||[]).forEach(n=>{if(!s.has(n)){s.add(n);st.push(n)}})}return s}

const xd=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),12):'';
function rd(v){ // Excel-Wert → JJJJ-MM-TT
  if(v===''||v==null)return '';
  if(typeof v==='number'){const c=XLSX.SSF.parse_date_code(v);return c?`${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`:''}
  if(v instanceof Date)return iso(new Date(v.getTime()+12*3600e3));
  v=String(v).trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  return '';
}

  const title=$('#f_title').value.trim();if(!title){toast('Bitte beschreiben, was zu tun ist.');return}
  const d={title,projectIds:selP(),deptId:$('#f_deptId').value,eventId:$('#f_eventId').value,endEventId:$('#f_endEventId').value,who:$('#f_who').value.trim(),start:$('#f_start').value,due:$('#f_due').value,status:$('#f_status').value,prio:+$('#f_prio').value,notes:$('#f_notes').value,links:LE.slice(),steps:JSON.parse(JSON.stringify(CE))};
  if(d.start&&d.due&&d.start>d.due){toast('Start liegt nach Fälligkeit.');return}
  if(d.eventId&&d.eventId!=='__new'&&d.eventId===d.endEventId){toast('Start- und Abschluss-Event müssen verschieden sein.');return}
  const cv=ckValidate(d.steps);if(cv){toast(cv);return}
  if(d.status==='erledigt'&&ckOpenReq(d.steps).length){toast('Pflichtpunkte offen: '+ckOpenReq(d.steps).map(x=>x.title).join(', ')+' – erledigen, n. a. begründen oder ⚠ mit Risiko übergehen.');return}
  closeModal();d.projectIds.forEach(pid=>ensureProjectDept(pid,d.deptId));d.projectId=d.projectIds[0]||'';
  const roles=t=>{if(t.eventId==='__new')t.eventId=newRoleEvent(t,'st');if(t.endEventId==='__new')t.endEventId=newRoleEvent(t,'en')};
  roles(d);
  if(id){const t=T(id),ch=diffText(t,d),was=t.status,tm=['start','due','eventId','endEventId'].some(k=>(t[k]||'')!==(d[k]||''));Object.assign(t,d);if(d.status==='erledigt'&&was!=='erledigt')t.doneAt=TODAY();if(d.status!=='erledigt')t.doneAt=null;applyRisks(t);
    const mv=tm?applyCouple(t.id):[],fin=d.status==='erledigt'&&was!=='erledigt'?closeEndEvent(t):[];if(d.status!=='erledigt'&&was==='erledigt')reopenEnd(t);
    if(ch||mv.length||fin.length)commit('geändert','todo',t,`${t.title} – ${ch||'Events'}`);else render();
    coupleToast(mv,fin);if(d.status==='erledigt'&&was!=='erledigt'&&!t.endEventId)askResult(t)}
  else{const t={id:uid(),created:TODAY(),...d};if(UI.newRows){t.rows=UI.newRows;UI.newRows=null}if(t.status==='erledigt')t.doneAt=TODAY();S.todos.push(t);applyRisks(t);
    const mv=applyCouple(t.id);
    commit('angelegt','todo',t,`${t.title} [${D(t.deptId)?.name||'–'}]${t.who?' Wer: '+t.who:''}${t.due?' – bis '+fmt(t.due):''}`);coupleToast(mv,[])}
}
async function delTodo(id){const t=T(id);if(!await askP(`ToDo „${t.title}“ löschen?`))return;S.todos=S.todos.filter(x=>x.id!==id);S.events.forEach(e=>{if(e.todoId===id)e.todoId=''});[...S.events,...S.todos].forEach(e=>e.causes=(e.causes||[]).filter(c=>c!==id));if(UI.sel===id)UI.sel=null;closeModal();commit('gelöscht','todo',t,t.title)}
function toggleDone(id){const t=T(id);
  if(t.status==='erledigt'){t.status='offen';t.doneAt=null;reopenEnd(t);commit('wieder geöffnet','todo',t,t.title)}
  else{if(finishBlocked(t))return;t.status='erledigt';t.doneAt=TODAY();const fin=closeEndEvent(t);commit('erledigt','todo',t,t.title);if(fin.length)coupleToast([],fin);else if(!t.endEventId)askResult(t)}}
/* ToDo wieder geöffnet → automatisch eingetretenes Abschluss-Event wieder „geplant“ */
function reopenEnd(t){const e=E(t.endEventId);if(e&&e.done){e.done=false;if(e.plan&&e.plan>=TODAY()){e.date=e.plan;applyCouple(e.id)}delete e.plan;S.log.unshift(logEntry('wieder geplant','event',e,`${e.title} – wieder geplant${e.date?' zum '+fmt(e.date):''} (ToDo „${t.title}“ wieder geöffnet)`))}}
function coupleToast(mv,fin){const a=[...fin,...mv.map(y=>`↔ ${y.title}: ${rng(sOf(y),eOf(y))}`)];if(a.length)toast(a.slice(0,3).join(' · ')+(a.length>3?` · … +${a.length-3}`:''))}
function resultFor(id){const t=T(id);if(!t)return;const dn=t.status==='erledigt';editEvent(null,{projectIds:[...pids(t)],deptId:t.deptId,type:'befund',title:'Ergebnis: '+t.title,date:dn?(t.doneAt||TODAY()):(t.due||TODAY()),done:dn,_endOf:t.id})}
function askResult(t){toast(`„${trunc(t.title,40)}“ erledigt.`,'Ergebnis dokumentieren',()=>resultFor(t.id))}

  UI.evCtx=id?null:{rows:pre._rows||null};const pStart=pre._triggerFor||'',pEnd=pre._endOf||'';delete pre._rows;delete pre._triggerFor;delete pre._endOf;

  const tds=id?S.todos.filter(t=>t.eventId===id):[],evs=id?S.events.filter(x=>(x.causes||[]).includes(id)):[];
  const st0=id?(evStarts(id)[0]?.id||''):pStart,en0=id?(evEnds(id)[0]?.id||''):pEnd,du0=e.todoId||'',dn0=id?evDone(e):(pre.done!=null?!!pre.done:(e.date||TODAY())<=TODAY());

    <label>Abteilung (wo entsteht es?)<select id="f_deptId">${deptOpts(e.deptId)}</select></label>

    <label>Art<select id="f_type">${S.types.map(t=>`<option value="${t.key}" ${t.key===e.type?'selected':''}>${t.icon} ${esc(t.label)}</option>`).join('')}</select></label>
    <label>Bewertung<select id="f_sig"><option value="">wie Art vorgibt</option>${opts(SIG,e.sig||'')}</select></label>
    <label>Phase<select id="f_phaseId"></select></label>
    <label>Wer (Beteiligte)<input id="f_who" list="people" value="${esc(e.who)}"></label>
    <label class="chk full" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="f_done" ${dn0?'checked':''} ${id?'data-touched="1"':''} onchange="this.dataset.touched=1" style="width:auto"> <b>Eingetreten</b> <span class="muted" style="font-size:12px">– sonst geplant (gestrichelt). Ein eingetretenes Abschluss-Event erledigt sein ToDo automatisch.</span></label>
    <div class="full evroles"><div class="muted" style="font-size:12px;margin-bottom:4px">Rolle im ToDo – das Event erscheint dann als Symbol im Balken (▶ am Start, ■ am Ende, ● dazwischen)</div>
     <div class="form" style="padding:0;gap:8px"><label>■ Beendet ToDo<select id="f_endOf" data-v0="${id?en0:''}"></select></label><label>▶ Startet ToDo<select id="f_startOf" data-v0="${id?st0:''}"></select></label><label class="full">● Während ToDo<select id="f_durOf"></select></label></div>
     ${id&&evStarts(id).length>1?`<div class="muted" style="font-size:12px">startet außerdem: ${evStarts(id).slice(1).map(t=>esc(t.title)).join(', ')}</div>`:''}</div>

  $('#f_causes').dataset.self=id||'';
  fillTodoSel('#f_endOf',en0);fillTodoSel('#f_startOf',st0);fillTodoSel('#f_durOf',du0);

function fillTodoSel(q,sel){const el=$(q);if(!el)return;const ps={projectIds:selP()};
  const L=[...S.todos].filter(t=>t.status!=='erledigt'||t.id===sel).sort((a,b)=>(share(b,ps)-share(a,ps))||String(a.start||a.due||'').localeCompare(String(b.start||b.due||'')));
  el.innerHTML='<option value="">— keinem —</option>'+L.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(trunc(D(t.deptId)?.name||'–',12))} · ${esc(trunc(t.title,44))} (${fmt(t.start)}–${fmt(t.due)})</option>`).join('')}
function fillEvDeps(phSel,causes){
  const ps={projectIds:selP()},p=P(ps.projectIds[0]),selfId=$('#f_causes').dataset.self,cq=($('#f_cq')?.value||'').toLowerCase();
  const curPh=phSel??$('#f_phaseId').value;
  const autoPh=curPh||(currentPhase(p,$('#f_date').value)||{}).id||'';
  $('#f_phaseId').innerHTML='<option value="">—</option>'+(p?.phases||[]).map(ph=>`<option value="${ph.id}" ${ph.id===autoPh?'selected':''}>${esc(ph.name)}</option>`).join('');
  const box=$('#f_causes');if(causes)box.dataset.sel=JSON.stringify(causes);else box.dataset.sel=JSON.stringify([...new Set([...JSON.parse(box.dataset.sel||'[]').filter(id=>!box.querySelector(`input[value="${id}"]`)),...[...box.querySelectorAll('input:checked')].map(i=>i.value)])]);
  const sel=JSON.parse(box.dataset.sel||'[]');
  const dn=x=>esc(trunc(D(x.deptId)?.name||'–',12));
  const pc=x=>`<span class="muted" style="font-size:11px">${esc(pids(x).map(i=>P(i)?.code||P(i)?.name).join(', ')||'Allgemein')}</span>`;
  const all=[...S.events.filter(e=>e.id!==selfId).map(e=>({o:e,d:e.date,id:e.id,k:'Event',l:`${fmt(e.date)} · <b>${dn(e)}</b> · ${esc(e.title)} ${pc(e)}`})),
    ...S.todos.filter(t=>!selfId||t.eventId!==selfId).map(t=>({o:t,d:t.doneAt||t.due||t.start||'',id:t.id,k:'ToDo',l:`<b>${dn(t)}</b> · ${esc(t.title)}${t.status==='erledigt'?' ✓':''} ${pc(t)}`}))]
    .filter(i=>sel.includes(i.id)||!cq||(i.o.title+' '+(D(i.o.deptId)?.name||'')+' '+pids(i.o).map(x=>P(x)?.name+' '+(P(x)?.code||'')).join(' ')).toLowerCase().includes(cq))
    .sort((a,b)=>(sel.includes(b.id)-sel.includes(a.id))||(share(b.o,ps)-share(a.o,ps))||String(b.d).localeCompare(String(a.d))).slice(0,150);
  $('#f_causes').innerHTML=all.length?all.map(i=>`<label class="chk"><input type="checkbox" value="${i.id}" ${sel.includes(i.id)?'checked':''}><span class="k">${i.k}</span><span>${i.l}</span></label>`).join(''):'<span class="muted">Keine passenden Elemente – dieses Event ist dann der Startpunkt einer Kette.</span>';
}
function saveEvent(id){
  const title=$('#f_title').value.trim();if(!title){toast('Bitte beschreiben, was passiert ist.');return}
  fillEvDeps();
  const d={title,projectIds:selP(),deptId:$('#f_deptId').value,phaseId:$('#f_phaseId').value,date:$('#f_date').value||TODAY(),type:$('#f_type').value,sig:$('#f_sig').value,who:$('#f_who').value.trim(),notes:$('#f_notes').value,links:LE.slice(),causes:JSON.parse($('#f_causes').dataset.sel||'[]'),done:$('#f_done').checked,todoId:$('#f_durOf').value};
  const endOf=$('#f_endOf').value,startOf=$('#f_startOf').value,en0=$('#f_endOf').dataset.v0,st0=$('#f_startOf').dataset.v0;
  if(endOf&&endOf===startOf){toast('Ein Event kann nicht dasselbe ToDo starten und beenden.');return}
  if(d.todoId&&(d.todoId===endOf||d.todoId===startOf)){toast('„Während“ muss ein anderes ToDo sein als Start/Abschluss.');return}
  if(d.done&&d.date>TODAY()){d.date=TODAY()}
  d.causes=d.causes.filter(c=>c!==endOf);
  closeModal();d.projectIds.forEach(pid=>ensureProjectDept(pid,d.deptId));d.projectId=d.projectIds[0]||'';
  /* Rollen setzen: Abschluss von / Start von */
  const setRoles=e=>{const rt=[];
    if(endOf!==en0){if(en0&&T(en0)&&T(en0).endEventId===e.id)T(en0).endEventId='';if(endOf){const t=T(endOf);if(t.eventId===e.id)t.eventId='';t.endEventId=e.id;rt.push('beendet „'+t.title+'“')}}
    if(startOf!==st0){if(st0&&T(st0)&&T(st0).eventId===e.id)T(st0).eventId='';if(startOf){const t=T(startOf);if(t.endEventId===e.id)t.endEventId='';if(t.eventId&&t.eventId!==e.id&&!(t.causes||[]).includes(t.eventId))(t.causes=t.causes||[]).push(t.eventId);t.eventId=e.id;rt.push('startet „'+t.title+'“')}}
    if(e.todoId&&T(e.todoId))rt.push('während „'+T(e.todoId).title+'“');return rt};
  if(id){const e=E(id);e.done=evDone(e);e.todoId=e.todoId||'';const ch=diffText(e,d),dm=e.date!==d.date;Object.assign(e,d);const rt=setRoles(e),mv=dm||rt.length?applyCouple(e.id):[],fin=d.done?occurEvent(e,false):[];
    if(ch||rt.length||mv.length||fin.length)commit('geändert','event',e,`${e.title} – ${[ch,...rt].filter(Boolean).join('; ')||'Rolle'}`);else render();coupleToast(mv,fin)}
  else{const e={id:uid(),created:TODAY(),...d};const ctx=UI.evCtx||{};UI.evCtx=null;if(ctx.rows)e.rows=ctx.rows;S.events.push(e);
    const rt=setRoles(e),mv=applyCouple(e.id),fin=d.done?occurEvent(e,false):[];
    commit('erfasst','event',e,`${tLabel(e.type)} [${D(e.deptId)?.name||'–'}]: ${e.title} (${fmt(e.date)}${e.done?'':', geplant'})${e.causes.length?' ← '+e.causes.map(c=>X_(c)?.title).join(', '):''}${rt.length?' – '+rt.join('; '):''}`);
    if(rt.length||mv.length||fin.length)coupleToast(mv,fin.length?fin:['Event erfasst – '+rt.join('; ')]);else toast('Event erfasst.','Folge-ToDo anlegen',()=>followTodo(e.id))}
}
async function delEvent(id){const e=E(id);if(!await askP(`Event „${e.title}“ löschen? Verknüpfungen werden gelöst.`))return;S.events=S.events.filter(x=>x.id!==id);S.todos.forEach(t=>{if(t.eventId===id)t.eventId='';if(t.endEventId===id)t.endEventId=''});[...S.events,...S.todos].forEach(x=>x.causes=(x.causes||[]).filter(c=>c!==id));if(UI.sel===id)UI.sel=null;closeModal();commit('gelöscht','event',e,e.title)}

function phaseRow(ph){return `<div class="phrow" data-id="${ph.id||uid()}"><input class="ph-n" value="${esc(ph.name||'')}" placeholder="Phase"><input type="date" class="ph-s" value="${ph.start||''}"><input type="date" class="ph-e" value="${ph.end||''}"><button class="ghost" title="Entfernen" onclick="this.parentNode.remove()">✕</button></div>`}
function lifecycleTpl(){let s=TODAY();$('#phases').insertAdjacentHTML('beforeend',LIFECYCLE.map(n=>{const r=phaseRow({name:n,start:s,end:addDays(s,59)});s=addDays(s,60);return r}).join(''))}

    <div class="full"><div class="muted" style="font-size:12px;margin-bottom:5px">Beteiligte Abteilungen (= Swimlanes im Gantt, in dieser Reihenfolge)</div>
      <div class="dsel" id="f_depts">${S.depts.map(d=>`<label class="chk"><input type="checkbox" value="${d.id}" ${(p.depts||[]).includes(d.id)?'checked':''}> <span class="dchip" style="--c:${d.color}">${esc(d.name)}</span></label>`).join('')}</div></div>

function saveProject(id){
  const name=$('#f_name').value.trim();if(!name){toast('Name fehlt.');return}
  const phases=[...document.querySelectorAll('#phases .phrow')].map(r=>({id:r.dataset.id,name:r.querySelector('.ph-n').value.trim(),start:r.querySelector('.ph-s').value,end:r.querySelector('.ph-e').value})).filter(ph=>ph.name).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const chosen=[...document.querySelectorAll('#f_depts input:checked')].map(i=>i.value);
  const old=id?(P(id).depts||[]):[];
  const depts=[...old.filter(x=>chosen.includes(x)),...chosen.filter(x=>!old.includes(x))];
  const d={name,code:$('#f_code').value.trim(),color:$('#f_color').value,status:$('#f_pstatus').value,owner:$('#f_owner').value.trim(),goal:$('#f_goal').value,phases,depts,links:LE.slice()};
  closeModal();
  if(id){const p=P(id);const ch=[];if(p.name!==d.name)ch.push(`Name: ${p.name} → ${d.name}`);if(p.status!==d.status)ch.push(`Status: ${PSTAT[p.status]} → ${PSTAT[d.status]}`);if(JSON.stringify(p.phases)!==JSON.stringify(d.phases))ch.push('Phasen angepasst');if(JSON.stringify(p.links||[])!==JSON.stringify(d.links))ch.push('Links: '+linkDiff(p.links||[],d.links));if(JSON.stringify(p.depts)!==JSON.stringify(d.depts))ch.push('Abteilungen: '+d.depts.map(x=>D(x)?.name).join(', '));
    Object.assign(p,d);if(ch.length)commit('geändert','project',p,`${p.name} – ${ch.join('; ')}`);else{persist();render()}}
  else{const p={id:uid(),created:TODAY(),...d};S.projects.push(p);commit('angelegt','project',p,p.name)}
}
async function delProject(id){const p=P(id);const n=[...S.events,...S.todos].filter(x=>pids(x).length===1&&pids(x)[0]===id).length;
  if(!await askP(`Projekt „${p.name}“ mit ${n} nur diesem Projekt zugeordneten Events/ToDos endgültig löschen?\nEinträge, die weitere Projekte betreffen, bleiben dort erhalten.\nTipp: Status „Abgeschlossen“ behält die Historie.`))return;
  S.projects=S.projects.filter(x=>x.id!==id);S.events=S.events.filter(e=>!(pids(e).length===1&&pids(e)[0]===id));S.todos=S.todos.filter(t=>!(pids(t).length===1&&pids(t)[0]===id));[...S.events,...S.todos].forEach(normItem);UI.pf=UI.pf.filter(x=>x!==id);UI.sel=null;closeModal();commit('gelöscht','project',p,p.name)}

/* Event-Arten verwalten */
async function addType(){const l=await askT('Neue Event-Art','Bezeichnung','');if(!l||!l.trim())return;const ic=(await askT('Symbol für „'+l.trim()+'“','Symbol (Emoji, z. B. 🧪 – unter Windows: Win + .)','•'))||'•';let k=l.trim().toLowerCase().replace(/[^a-z0-9äöüß]+/g,'')||uid();while(S.types.some(t=>t.key===k))k+='2';S.types.push({key:k,icon:ic.trim()||'•',label:l.trim(),sig:'neutral'});rebuildTypes();commit('Event-Art angelegt','system',null,ic+' '+l)}
function setType(k,f,v){const t=S.types.find(x=>x.key===k);if(!t)return;v=String(v).trim();if(!v&&f!=='sig')return render();t[f]=v;rebuildTypes();persist();render()}
function moveType(k,dir){const i=S.types.findIndex(t=>t.key===k),j=i+dir;if(j<0||j>=S.types.length)return;[S.types[i],S.types[j]]=[S.types[j],S.types[i]];rebuildTypes();persist();render()}

const qtype=()=>(S.types.find(t=>t.key==='info')||S.types[0]).key;
function findProject(c){c=c.toLowerCase();return S.projects.find(p=>(p.code||'').toLowerCase()===c)||S.projects.find(p=>p.name.toLowerCase().startsWith(c))||S.projects.find(p=>(p.code||'').toLowerCase().startsWith(c))}
function findDept(c){c=c.toLowerCase().replace(/_/g,' ');return S.depts.find(d=>d.name.toLowerCase()===c)||S.depts.find(d=>d.name.toLowerCase().startsWith(c))}
function parseQuick(s){
  let who='',pids=[],did='',prio=2,due='',ev=false;
  if(s.startsWith('*')){ev=true;s=s.slice(1)}
  s=s.replace(/(^|\s)@(\S+)/g,(m,a,w)=>{who=w.replace(/_/g,' ');return ' '});
  s=s.replace(/(^|\s)#(\S+)/g,(m,a,c)=>{if(c.toLowerCase()==='allgemein'){pids.push('');return ' '}const p=findProject(c);if(p){pids.push(p.id);return ' '}return m});
  s=s.replace(/(^|\s)\/(\S+)/g,(m,a,c)=>{const d=findDept(c);if(d){did=d.id;return ' '}return m});
  s=s.replace(/(^|\s)!(h|hoch|1)(?=\s|$)/i,()=>{prio=1;return ' '}).replace(/(^|\s)!(n|niedrig|3)(?=\s|$)/i,()=>{prio=3;return ' '});
  const td=TODAY();
  s=s.replace(/(^|\s)(bis\s+)?(\d{4}-\d{2}-\d{2})(?=\s|$)/i,(m,a,b,d)=>{due=d;return ' '});
  s=s.replace(/(^|\s)(bis\s+)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})?(?=\s|$)/i,(m,a,b,dd,mm,yy)=>{let y=yy?(+yy<100?2000+ +yy:+yy):+td.slice(0,4);let c=`${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;if(!yy&&c<td)c=`${y+1}${c.slice(4)}`;due=c;return ' '});
  s=s.replace(/(^|\s)(bis\s+)?(heute|morgen|übermorgen)(?=\s|$)/i,(m,a,b,w)=>{due=addDays(td,{heute:0,morgen:1,'übermorgen':2}[w.toLowerCase()]);return ' '});
  s=s.replace(/(^|\s)(bis\s+)?\+(\d+)([dw]?)(?=\s|$)/i,(m,a,b,n,u)=>{due=addDays(td,+n*(u.toLowerCase()==='w'?7:1));return ' '});
  s=s.replace(/(^|\s)(bis\s+)?(mo|di|mi|do|fr|sa|so)(?=\s|$)/i,(m,a,b,w)=>{const i=['so','mo','di','mi','do','fr','sa'].indexOf(w.toLowerCase());due=addDays(td,(i-new Date().getDay()+7)%7||7);return ' '});
  return {title:s.replace(/\s+/g,' ').trim(),who,pids,did,prio,due,ev};
}

    commit('erfasst','event',ev,`${tLabel(qtype())} [${D(did)?.name||'–'}]: ${ev.title}`);toast(`Event · ${where} · ${D(did)?.name||''}`,'Bearbeiten',()=>editEvent(ev.id))}

const LW=210,SUB=26,LH=26;
let G={start:'',px:20,x0:0,pos:{},justDragged:false,dropPending:false};
function evIco(e,role,css,ex){let sg=sigOf(e);const co=critOpen(e);if(sg==='kritisch'&&!co&&critResolved(e))sg='erledigt';const dn=evDone(e);

let _rzT=null;window.addEventListener('resize',()=>{clearTimeout(_rzT);_rzT=setTimeout(()=>{if(UI.view==='gantt'&&!document.querySelector('#modal.open'))render()},250)});
function vGantt(){

  S.events.forEach(e=>{if(vis(e)&&e.date)ds.push(e.date)});S.todos.forEach(t=>{if(vis(t)){if(t.due)ds.push(t.due);if(t.start)ds.push(t.start)}});
  ds.sort();let start=addDays(ds[0],-7).slice(0,8)+'01';let end=addDays(ds[ds.length-1],28);
  if(G.print&&G.print.from){start=G.print.from;end=G.print.to}
  /* Zeitschiene mindestens über die ganze Fensterbreite (v. a. in Jahres-/Quartalsansicht) */
  if(!G.print){const av=(($('#tl')?.clientWidth)||(($('#main')?.clientWidth||window.innerWidth-240)-48))/ZS()-LW;const need=Math.floor(av/px);if(diffDays(start,end)+1<need)end=addDays(start,need-1);
    /* rechts immer mindestens eine Fensterbreite Luft hinter dem letzten Eintrag; beim Scrollen ans Ende wächst die Zeitschiene weiter */
    end=addDays(end,need+(UI.extraDays||0))}
  const days=diffDays(start,end)+1,W=days*px,X=s=>diffDays(start,s)*px;
  G={...G,start,end,px,x0:X(td),X};
  let axis='',lines='';
  for(let m=new Date(start+'T12:00:00');iso(m)<=end;){const s=iso(m),n=new Date(m);n.setMonth(n.getMonth()+1);const w=diffDays(s,iso(n))*px;
    axis+=`<div class="tl-m" style="left:${X(s)}px;width:${w}px">${w>=70?m.toLocaleDateString('de-DE',{month:px>=6?'long':'short',year:'2-digit'}):w>=26?(m.getMonth()===0||s===start?m.toLocaleDateString('de-DE',{month:'short'}).replace('.','')+' '+String(m.getFullYear()).slice(2):m.toLocaleDateString('de-DE',{month:'short'}).replace('.','')):m.getMonth()%3===0?`Q${m.getMonth()/3+1} ${String(m.getFullYear()).slice(2)}`:''}</div>`;lines+=`<div class="vl m" style="left:${LW+X(s)}px"></div>`;m=n}
  const AXH=px>=20?62:42;
  /* Urlaub: für alle = graue Spalte über den ganzen Plan; je Person = Markierung oben in der Zeitachse */
  vacs().filter(v=>v.from&&v.to&&v.to>=start&&v.from<=end).forEach((v,i)=>{const a=v.from<start?start:v.from,b=v.to>end?end:v.to,w=(diffDays(a,b)+1)*px,tt=esc(`${v.title}${v.who?' – '+v.who:' – alle'}: ${rng(v.from,v.to)}`);
    if(!v.who)lines+=`<div class="vac" style="left:${LW+X(a)}px;width:${w}px" title="${tt}"></div>`;
    axis+=`<div class="vac-ax ${v.who?'p':''}" style="left:${X(a)}px;width:${Math.max(w,4)}px" title="${tt}" ondblclick="vacDlg()">${w>=34?(v.who?esc(v.who):'🏖 '+esc(v.title)):''}</div>`});
  if(px>=12){for(let i=0;i<days;i++){const ds_=addDays(start,i),dw=new Date(ds_+'T12:00:00').getDay();
    if(dw!==1)lines+=`<div class="vl d" style="left:${LW+i*px}px"></div>`;
    if(px>=20)axis+=`<div class="tl-d ${dw===0||dw===6?'we':''} ${ds_===td?'td':''}" style="left:${i*px}px;width:${px}px">${px>=44?WD[dw]+' ':''}${+ds_.slice(8)}</div>`}}
  const wd=new Date(start+'T12:00:00');while(wd.getDay()!==1)wd.setDate(wd.getDate()+1);

     ${isE?`<button class="sm" onclick="followTodo('${x.id}')">＋ Folge-ToDo</button>${isMS(x)?`<button class="sm pri" onclick="reviewDlg('${x.id}')" title="Stand zum Review fixieren: Gantt, Termine, offene Punkte, Historie">📄 Review-Bericht</button>`:''}`:`${x.eventId?'':`<button class="sm" onclick="triggerEvent('${x.id}')" title="Event am Starttag anlegen und als Auslöser verknüpfen">＋ Start-Event</button>`}${x.endEventId?'':`<button class="sm" onclick="closingEvent('${x.id}')" title="Event am Ende – tritt es ein, ist das ToDo erledigt">＋ Abschluss-Event</button>`}`}
     <button class="sm" onclick="followEvent('${x.id}')">＋ Folge-Event</button></div>
    <h4>Verlauf</h4>${(()=>{const hs=S.log.filter(l=>l.ref===x.id);return hs.map((l,i)=>`<div style="font-size:12px;padding:4px 0;border-top:1px solid var(--line);display:flex;gap:6px"><div style="flex:1"><span class="muted">${tsNice(l.ts)} · ${esc(l.user)}</span><br>${esc(l.action)}${l.text.includes(' – ')?': '+esc(l.text.split(' – ').slice(1).join(' – ')):''}</div>${i>0&&l.snap?`<button class="ghost sm" title="Auf den Stand nach dieser Änderung zurücksetzen" onclick="restoreLog('${l.id}')">↺</button>`:''}</div>`).join('')||'<span class="muted">—</span>'})()}
   </div>`;
  dr.classList.add('open');markDead($('#dlinks'));markDead($('#dsteps'));
}

function help(){modal('Kurzanleitung',`<div class="help">
 <p><b>Prinzip:</b> Ein <b>Event</b> entsteht in einer <b>Abteilung</b> (Befund in der Qualität, Entscheidung in der Entwicklung, Lieferung im Einkauf …). Es löst <b>ToDos</b> aus – auch in anderen Abteilungen. Erledigte ToDos führen zu neuen Events. Im <b>Gantt</b> zeigen Pfeile diese Kette; gestrichelt, wenn sie die Abteilung wechselt.</p>
 <p><b>Events im ToDo:</b> Ein ToDo hat ein <b>▶ Start-Event</b> (löst es aus), beliebige <b>● Events während</b> (Telefonat, Mail, Zwischenergebnis) und ein <b>■ Abschluss-Event</b>. Alle erscheinen als Symbole <i>im</i> Balken: ▶ am Anfang, ■ am Ende, ● am jeweiligen Tag. <b>Einfügen:</b> in der Leiste „Event einfügen“ über dem Gantt ein Symbol greifen und in den Balken ziehen – es landet an dem Tag, an dem du loslässt; danach Titel und Beschreibung eintragen. An eine freie Stelle gezogen wird es ein freies Event. <b>Symbol im Balken ziehen:</b> innerhalb des Balkens = Tag verschieben; auf ein anderes ToDo = verbinden; an eine freie Stelle = daraus wird ein <b>neues ToDo</b> (Balken ab dem Tag, verknüpft mit dem Event). <b>Event-Symbol mit der Maus ziehen</b> = Verbindung von diesem Event zu einem anderen ToDo (z. B. eine parallele Maßnahme) oder Event; umgekehrt den kleinen Kreis rechts am Balken auf ein Event-Symbol ziehen (z. B. zurück zur Freigabe). Ein Event kann zugleich Abschluss des einen und Start des nächsten ToDos sein (z. B. Einkauf „Beauftragung“ ■ „Bestellung liegt vor“ ▶ QM „Erstbemusterung“ ■ „Warenfreigabe“) – der Pfeil läuft dann vom Ende des einen zum Anfang des anderen Balkens. <b>Gestrichelt</b> = geplant, durchgezogen = eingetreten. Geplante Events wandern mit dem Balken (Start = Balkenanfang, Abschluss = Balkenende) und ziehen gekoppelte ToDos mit; eingetretene bleiben fest. Tritt ein Abschluss-Event ein (✓ in der Detail-Leiste oder „Eingetreten“ im Event), ist das ToDo automatisch erledigt – sofern keine Pflichtpunkte offen sind. Umgekehrt: ToDo erledigt → sein Abschluss-Event tritt heute ein. Events ohne ToDo bleiben eigene Symbole in der Swimlane.</p>
 <p><b>Projekt oder allgemein:</b> Fast alles wirkt in Projekte hinein – ein Event oder ToDo kann deshalb <b>mehreren Projekten</b> zugeordnet sein (⧉ im Gantt) und erscheint in jedem davon. Ohne Projekt landet es unter <i>Allgemein</i> (Schulungen, allgemeine Besprechungen).</p>
 <p><b>Symbole & Signal:</b> Das Symbol zeigt, <i>was</i> passiert ist (📧 📞 📦 …). Ob etwas brennt, zeigt die Farbe: <b class="late">roter Ring</b> = kritisch, pulsierend mit „!“ = kritisch und noch keine Maßnahme, gestrichelt = abgestellt (direkte Maßnahmen erledigt oder Freigabe/Befund eingetreten), grüner Ring = positiv. „⚠ Fokus: Kritisches“ blendet alles andere aus. Symbole und Bewertung pflegst du unter „Projekte & Abteilungen“.</p>
 <p><b>Checkliste:</b> Im ToDo eigene Punkte in Reihenfolge anlegen (! am Anfang = Pflicht ★) oder eine Vorlage laden. Jeder Punkt kann eigene Dokumente haben: Punkt anklicken, dann 📎, ⎘ (Einfügen), Strg+V oder Datei darauf ziehen. Status je Punkt: ☐ offen · ☑ erledigt · – n. a. (mit Begründung) · ⚠ übergangen. <b>Übergehen</b> ist eine bewusste Abweichung: Begründung, mögliche Folge und „akzeptiert von“ sind Pflicht; das ToDo trägt dann ein rotes ⚠ mit der Anzahl übergangener Punkte, und die Entscheidung bleibt mit Datum in Checkliste und Historie nachvollziehbar. Ein ToDo „Nachholen“ entsteht nur auf Wunsch (Häkchen im Punkt oder „＋ Nachhol-ToDo“ in der Detail-Leiste); ist es erledigt, wird das ⚠ grau. Ein ToDo lässt sich erst erledigen, wenn alle Pflichtpunkte erledigt, n. a. oder übergangen sind. Vorlagen pflegst du unter „Projekte & Abteilungen“.</p>
 <p><b>Dateien verknüpfen per Kopieren:</b> Im Explorer Dateien markieren und <b>Strg+C</b>, dann im Cockpit ein ToDo/Event anklicken (oder dessen Bearbeiten-Dialog öffnen) und <b>Strg+V</b>.</p>
 <p><b>Links:</b> ToDos, Events und Projekte können Links zu Dateien (Word, Excel, PDF, CAD …), Ordnern, Outlook-Mails (.msg) und Webseiten haben – im Bearbeiten-Dialog, in der Detail-Leiste (＋ Datei / ＋ Ordner) oder im Desktop-Programm einfach per Drag & Drop aus dem Explorer auf ein Element. 📎 öffnet den Link direkt im passenden Programm, 📂 zeigt die Datei im Explorer. Nicht mehr gefundene Dateien werden rot durchgestrichen. In der Browser-Version kopiert ein Klick den Pfad (Win+R → einfügen → Enter), weil Browser keine lokalen Dateien öffnen dürfen.</p>
 <p><b>Status & Historie:</b> Status (bzw. Bewertung bei Events) direkt in der Detail-Leiste umschalten. Jede Änderung wird mit Stand gespeichert: In der Detail-Leiste und unter „Historie“ setzt ↺ ein Element auf einen früheren Stand zurück, gelöschte Elemente lassen sich wiederherstellen. Die Historie lässt sich nach Projekt, Art und Zeitraum filtern und als Excel oder druckbarer Bericht (PDF über „Als PDF speichern“) exportieren.</p>
 <p><b>Phasen:</b> In der Projektzeile jedes Projekts lassen sich Phasen direkt setzen (leere Fläche aufziehen), verschieben (ziehen), in Start/Ende ändern (Ränder) und per Klick umbenennen oder löschen. Beim Verschieben fragt das Cockpit, ob die Folgephasen mitwandern sollen.</p>
 <p><b>Events schnell setzen:</b> <b>Shift + Klick</b> in eine leere Swimlane legt dort ein Event an (Tag, Abteilung und Zeile wie angeklickt). Bei einem ToDo setzen „＋ Start-Event“ / „＋ Abschluss-Event“ / „＋ während“ (Detail-Leiste oder Bearbeiten-Dialog) das Event direkt mit der passenden Rolle; im ToDo-Editor legt „＋ neues … Event“ ein geplantes Event zum Start bzw. zur Fälligkeit an.</p>
 <p><b>Zeilen:</b> Jede Abteilung zeigt dezente Zeilenlinien und hat unten immer eine freie Zeile. Ein neuer Balken landet in der Zeile, in der du ihn aufziehst. Balken und Events lassen sich senkrecht in eine andere Zeile, Abteilung oder ein anderes Projekt ziehen (blaue Markierung = Ziel). ⇅ an der Abteilung ordnet die Zeilen wieder automatisch.</p>
 <p><b>Setzen, verbinden, löschen:</b> In einer leeren Swimlane mit der Maus aufziehen = neues ToDo in diesem Zeitraum und dieser Zeile. Am kleinen Kreis rechts an einem Balken oder Event auf ein anderes Element ziehen = verbinden, direkt oder mit einer dazwischengeschalteten Entscheidung. Element anklicken und Entf = löschen. In der Detail-Leiste lassen sich Verbindungen mit ✕ wieder lösen.</p>
 <p><b>Ziehen mit der Maus:</b> Balken in der Mitte greifen = verschieben, am linken/rechten Rand = Start/Ende ändern. Events lassen sich ebenfalls verschieben. Während des Ziehens zeigt ein <b class="late">roter Pfad</b>, welche Folgepunkte sich dadurch verschieben würden (rot gestrichelt = neue Lage, „+n T“), orange gestrichelt = der Punkt liegt dann vor dem Ende seiner Ursache. Beim Loslassen entscheidest du: nur diesen Punkt oder mit allen Folgen. Esc bricht ab, „Rückgängig“ im Hinweis macht es ungeschehen.</p>
 <p><b>Meilensteine & Design Reviews:</b> Events der Art „🚩 Meilenstein“ oder „📋 Design Review“ erscheinen als senkrechte Linie über das ganze Projekt (Allgemein: über den ganzen Plan), Beschriftung oben im Projektkopf; gepunktet = geplant. In der Detail-Leiste eines Reviews/Meilensteins fixiert <b>„📄 Review-Bericht“</b> den Stand seit dem letzten Review: Gantt im Zeitraum, alle Termine und Aufgaben, offene Punkte zum Stichtag (offene ToDos, kritische Events, übergangene Checklistenpunkte, nicht eingetretene geplante Events), Historie und ein Unterschriftenfeld – als PDF oder als Word-Datei (im Desktop-Programm wird die Word-Datei direkt am Review verknüpft). Die Erstellung wird in der Historie festgehalten.</p>
 <p><b>Rückgängig:</b> <b>Strg + Z</b> macht die letzte Änderung rückgängig (mehrfach möglich), <b>Strg + Y</b> bzw. Strg + Umschalt + Z stellt sie wieder her. Die Historie bleibt dabei vollständig – das Rückgängigmachen wird dort selbst als Eintrag vermerkt. In Eingabefeldern wirkt Strg + Z wie gewohnt auf den Text.</p>
 <p><b>Urlaub:</b> „🏖 Urlaub“ über dem Gantt. Ohne „Wer“ gilt ein Zeitraum für alle (graue Spalte, z. B. Betriebsurlaub, Feiertage), mit „Wer“ nur für ToDos dieser Person. Balken, die darüber laufen, werden um die Urlaubstage verlängert bzw. ein Start im Urlaub dahinter verschoben (mit Vorschau), Folgen rücken nach. Auch beim Verschieben mit der Maus behält ein ToDo seine Arbeitstage. Im Balken ist die Urlaubszeit schraffiert.</p>
 <p><b>Größe:</b> − / ＋ über dem Gantt oder <b>Strg + Mausrad</b> vergrößert bzw. verkleinert die ganze Darstellung (Schrift, Balken, Symbole); Klick auf die Prozentzahl = 100 %. Jahr/Quartal/Monat/Woche bestimmen weiterhin den Zeitmaßstab.</p>
 <p><b>Gantt:</b> Klick auf ein Element hebt die gesamte Kette hervor und zeigt rechts Ursache, Wirkung und Verlauf. Doppelklick öffnet den Editor, Doppelklick in eine leere Swimlane legt dort ein ToDo am angeklickten Datum an.</p>
 <p><b>Schnellerfassung</b> (Feld oben, Enter):</p>
 <table><tr><td><code>@Name</code></td><td>Wer (Leerzeichen als _)</td></tr><tr><td><code>#PRJ-A #PRJ-B</code></td><td>ein oder mehrere Projekte (<code>#allgemein</code> = ohne Projekt)</td></tr><tr><td><code>/Einkauf</code></td><td>Abteilung (Namensanfang genügt: <code>/ein</code>)</td></tr>
 <tr><td><code>bis fr</code> <code>morgen</code> <code>+3</code> <code>+2w</code> <code>14.11.</code></td><td>Fälligkeit</td></tr><tr><td><code>!hoch</code> <code>!niedrig</code></td><td>Priorität</td></tr><tr><td><code>*Text</code></td><td>Event statt ToDo</td></tr></table>
 <p>Beispiel: <code>Muster Material B anfragen @Lieferant_X #PRJ-A /Einkauf bis fr !hoch</code></p>
 <p><b>Excel:</b> „Excel-Datei verbinden“ macht eine .xlsx-Datei zur Datenbasis – jede Änderung wird automatisch gespeichert (Edge/Chrome). Die Datei kann in Excel bearbeitet und ausgewertet werden; beim Zurückwechseln übernimmt das Cockpit die Änderungen. Excel-Export/-Import funktioniert in jedem Browser.</p>
 <p><b>Tasten:</b> <code>N</code> Schnellerfassung · <code>1</code>–<code>4</code> Ansicht · <code>Esc</code> schließen</p>
 <p><b>Filter links:</b> Klick blendet Projekt/Abteilung ein oder aus, Doppelklick zeigt nur dieses.</p></div>`,[{l:'Verstanden',c:'pri',f:closeModal}])}

/* ================= Navigation & Render ================= */
const VIEWS={cockpit:{t:'Cockpit',r:vCockpit},gantt:{t:'Gantt',r:vGantt,a:afterGantt},projects:{t:'Projekte & Abteilungen',r:vProjects},log:{t:'Historie',r:vLog}};
$('#nav').innerHTML=Object.entries(VIEWS).map(([k,v],i)=>`<button data-view="${k}" onclick="go('${k}')">${v.t}<kbd>${i+1}</kbd></button>`).join('');
function go(v){UI.view=v;if(v==='gantt')UI.focusDate=TODAY();render();$('#view').scrollTop=0}
let fClick;
function toggleF(key,all,id,only){
  let f=UI[key];
  if(only)f=f.length===1&&f[0]===id?[]:[id];
  else{f=f.length?[...f]:[...all];f=f.includes(id)?f.filter(x=>x!==id):[...f,id];if(f.length===all.length)f=[]}
  UI[key]=f;render();
}
function fC(key,id){clearTimeout(fClick);fClick=setTimeout(()=>toggleF(key,key==='pf'?[...S.projects.map(p=>p.id),'']:[...S.depts.map(d=>d.id),''],id),220)}
function fD(key,id){clearTimeout(fClick);toggleF(key,null,id,true)}
function renderSide(){
  UI.pf=UI.pf.filter(id=>id===''||P(id));UI.df=UI.df.filter(id=>id===''||D(id));
  $('#projFilter').innerHTML=S.projects.map(p=>`<button class="pf ${pVis(p.id)?'':'off'}" style="--c:${p.color}" onclick="fC('pf','${p.id}')" ondblclick="fD('pf','${p.id}')" title="Klick: ein-/ausblenden · Doppelklick: nur dieses"><span class="dot"></span><span class="n">${esc(p.name)}</span><span class="c">${S.todos.filter(t=>inP(t,p.id)&&t.status!=='erledigt').length}</span></button>`).join('')
    +`<button class="pf ${pVis('')?'':'off'}" style="--c:#8a8f98" onclick="fC('pf','')" ondblclick="fD('pf','')" title="Projektübergreifend: Schulungen, allgemeine Besprechungen …"><span class="dot"></span><span class="n"><i>Allgemein</i></span><span class="c">${S.todos.filter(t=>!pids(t).length&&t.status!=='erledigt').length}</span></button>`+(UI.pf.length?`<button class="pf" onclick="UI.pf=[];render()"><span class="n muted">Alle Projekte zeigen</span></button>`:'')+(S.projects.length?'':`<div class="empty" style="padding:2px 10px">Noch keine Projekte</div>`);
  $('#deptFilter').innerHTML=S.depts.map(d=>`<button class="pf ${dVis(d.id)?'':'off'}" style="--c:${d.color}" onclick="fC('df','${d.id}')" ondblclick="fD('df','${d.id}')" title="Klick: ein-/ausblenden · Doppelklick: nur diese"><span class="dot" style="border-radius:50%"></span><span class="n">${esc(d.name)}</span><span class="c">${S.todos.filter(t=>t.deptId===d.id&&t.status!=='erledigt'&&pVis(t.projectId)).length}</span></button>`).join('')
    +(UI.df.length?`<button class="pf" onclick="UI.df=[];render()"><span class="n muted">Alle Abteilungen zeigen</span></button>`:'');
}
function render(){
  const tl=$('#tl');if(tl&&UI.view==='gantt'&&!UI.focusDate)UI.scroll=tl.scrollLeft;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===UI.view));
  const v=VIEWS[UI.view]||VIEWS.cockpit;
  const f=[UI.pf.length===1?P(UI.pf[0])?.name:'',UI.df.length===1?D(UI.df[0])?.name:''].filter(Boolean);
  $('#viewTitle').textContent=v.t+(f.length?' · '+f.join(' · '):'');
  renderSide();
  if(UI.sel&&!X_(UI.sel))UI.sel=null;
  $('#view').innerHTML=v.r();v.a&&v.a();
  renderDrawer();
  $('#people').innerHTML=[...new Set([...S.todos,...S.events].map(x=>x.who).filter(Boolean).concat(S.projects.map(p=>p.owner).filter(Boolean)))].sort().map(w=>`<option value="${esc(w)}">`).join('');
  renderStore();saveUI();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();else if(UI.sel){UI.sel=null;render()}return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&['z','y'].includes(e.key.toLowerCase())&&!e.target.closest('input,textarea,select,[contenteditable]')&&!$('#modal').classList.contains('open')){
    e.preventDefault();undoApply(e.key.toLowerCase()==='y'||e.shiftKey?1:-1);return}
  if(e.target.closest('input,textarea,select')||$('#modal').classList.contains('open')||e.ctrlKey||e.metaKey||e.altKey)return;
  if((e.key==='Delete'||e.key==='Backspace')&&UI.sel&&X_(UI.sel)){e.preventDefault();E(UI.sel)?delEvent(UI.sel):delTodo(UI.sel);return}
  if(e.key==='n'||e.key==='N'){e.preventDefault();$('#quick').focus()}
  const k=Object.keys(VIEWS)[+e.key-1];if(k)go(k);
});
